name: Astra 24-7 Cloud Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '45 */5 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: astra-arcana-matrix-bots-live
  cancel-in-progress: true

jobs:
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore persistent SQLite memory from bot-memory branch
        run: |
          mkdir -p data arcana_bot/data matrix_bot/data kairos_chrona/data
          if git fetch origin bot-memory 2>/dev/null; then
            git checkout origin/bot-memory -- \
              data/astra_state.db \
              arcana_bot/data/arcana_state.db \
              matrix_bot/data/matrix_state.db \
              kairos_chrona/data/ecosystem.db 2>/dev/null || true
            echo "Restored persistent SQLite databases from bot-memory branch."
          else
            echo "No bot-memory branch yet; starting fresh."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Astra, Arcana, Matrix, Kairos & Chrona Bots 24/7 in parallel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAROT_BOT_TOKEN: ${{ secrets.TAROT_BOT_TOKEN }}
          MATRIX_BOT_TOKEN: ${{ secrets.MATRIX_BOT_TOKEN }}
          KAIROS_BOT_TOKEN: ${{ secrets.KAIROS_BOT_TOKEN }}
          CHRONA_BOT_TOKEN: ${{ secrets.CHRONA_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sync_memory() {
            MEMORY_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}"
            if [ -z "$MEMORY_TOKEN" ]; then
              echo "WARNING: No token available to sync bot-memory branch."
              return 0
            fi
            TMP_SYNC="/tmp/bot_memory_sync"
            rm -rf "$TMP_SYNC"
            mkdir -p "$TMP_SYNC/data" "$TMP_SYNC/arcana_bot/data" "$TMP_SYNC/matrix_bot/data" "$TMP_SYNC/kairos_chrona/data"
            cp -f data/astra_state.db "$TMP_SYNC/data/" 2>/dev/null || true
            cp -f arcana_bot/data/arcana_state.db "$TMP_SYNC/arcana_bot/data/" 2>/dev/null || true
            cp -f matrix_bot/data/matrix_state.db "$TMP_SYNC/matrix_bot/data/" 2>/dev/null || true
            cp -f kairos_chrona/data/ecosystem.db "$TMP_SYNC/kairos_chrona/data/" 2>/dev/null || true
            (
              cd "$TMP_SYNC"
              git init -q
              git config user.name "astra-memory-bot"
              git config user.email "astra-memory@users.noreply.github.com"
              git add -f .
              if ! git diff --cached --quiet; then
                git commit -q -m "Sync persistent bot memory"
                if ! git push -q -f "https://x-access-token:${MEMORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/bot-memory; then
                  echo "WARNING: Failed to push bot-memory branch."
                fi
              fi
            )
          }

          start_astra() { PORT=7860 python -m bot.main & ASTRA_PID=$!; }
          start_arcana() { (cd arcana_bot && PORT=7861 python -m bot.main) & ARCANA_PID=$!; }
          start_matrix() { (cd matrix_bot && PORT=7862 python -m bot.main) & MATRIX_PID=$!; }
          start_kairos_chrona() { (cd kairos_chrona && python run_ecosystem.py) & KAIROS_CHRONA_PID=$!; }

          start_astra
          start_arcana
          start_matrix
          start_kairos_chrona

          # Supervisor loop: monitor processes every 30s, auto-restart crashed bots, sync memory every 3 min
          START_TS=$(date +%s)
          LAST_SYNC=$START_TS
          RUN_DURATION=20100

          while true; do
            sleep 30
            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))
            if [ "$ELAPSED" -ge "$RUN_DURATION" ]; then
              echo "Reached planned run duration (${ELAPSED}s); initiating graceful handover."
              break
            fi

            if ! kill -0 "$ASTRA_PID" 2>/dev/null; then
              echo "WARNING: Astra bot exited unexpectedly; restarting..."
              start_astra
            fi
            if ! kill -0 "$ARCANA_PID" 2>/dev/null; then
              echo "WARNING: Arcana bot exited unexpectedly; restarting..."
              start_arcana
            fi
            if ! kill -0 "$MATRIX_PID" 2>/dev/null; then
              echo "WARNING: Matrix bot exited unexpectedly; restarting..."
              start_matrix
            fi
            if ! kill -0 "$KAIROS_CHRONA_PID" 2>/dev/null; then
              echo "WARNING: Kairos/Chrona ecosystem exited unexpectedly; restarting..."
              start_kairos_chrona
            fi

            if [ $((NOW_TS - LAST_SYNC)) -ge 180 ]; then
              sync_memory || true
              LAST_SYNC=$NOW_TS
            fi
          done

          kill "$ASTRA_PID" "$ARCANA_PID" "$MATRIX_PID" "$KAIROS_CHRONA_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          sync_memory || true

      - name: Final memory backup & trigger seamless continuation run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MEMORY_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}"
          TMP_SYNC="/tmp/bot_memory_sync_final"
          rm -rf "$TMP_SYNC"
          mkdir -p "$TMP_SYNC/data" "$TMP_SYNC/arcana_bot/data" "$TMP_SYNC/matrix_bot/data" "$TMP_SYNC/kairos_chrona/data"
          cp -f data/astra_state.db "$TMP_SYNC/data/" 2>/dev/null || true
          cp -f arcana_bot/data/arcana_state.db "$TMP_SYNC/arcana_bot/data/" 2>/dev/null || true
          cp -f matrix_bot/data/matrix_state.db "$TMP_SYNC/matrix_bot/data/" 2>/dev/null || true
          cp -f kairos_chrona/data/ecosystem.db "$TMP_SYNC/kairos_chrona/data/" 2>/dev/null || true
          (
            cd "$TMP_SYNC"
            git init -q
            git config user.name "astra-memory-bot"
            git config user.email "astra-memory@users.noreply.github.com"
            git add -f .
            if ! git diff --cached --quiet; then
              git commit -q -m "Final sync persistent bot memory"
              git push -q -f "https://x-access-token:${MEMORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/bot-memory || echo "WARNING: Final memory push failed."
            fi
          ) || true

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret GH_PAT is not set! Cannot trigger seamless continuation run. Bots will wait for the next cron schedule."
          else
            if ! gh workflow run "Astra 24-7 Cloud Bot" --ref main; then
              echo "::warning::gh workflow run failed — check that GH_PAT has 'repo' and 'workflow' scopes and is not expired."
            else
              echo "Triggered seamless continuation run successfully."
            fi
          fi
